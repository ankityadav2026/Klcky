
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Typing Test | Klyck</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="practice-page">

    <nav class="navbar">
        <a href="/" class="brand">
            <span class="logo">K</span>
            <span>Klyck</span>
        </a>

        <a href="/" class="nav-button">← Home</a>
    </nav>

    <main class="test-container">

        <div class="test-heading">
            <span class="eyebrow">K / TYPING LAB</span>
            <h1>Test your <span>speed.</span></h1>
            <p>Focus on accuracy. Speed will follow.</p>
        </div>

        <div class="test-controls">
            <div class="time-options">
                <button class="time-btn active" data-time="15">15s</button>
                <button class="time-btn" data-time="30">30s</button>
                <button class="time-btn" data-time="60">60s</button>
                <button class="time-btn" data-time="120">120s</button>
            </div>

            <button id="restartBtn" class="restart-btn">
                ↻ Restart
            </button>
        </div>

        <section class="test-stats">
            <div class="test-stat">
                <span>WPM</span>
                <strong id="wpm">0</strong>
            </div>

            <div class="test-stat">
                <span>ACCURACY</span>
                <strong id="accuracy">100%</strong>
            </div>

            <div class="test-stat">
                <span>TIME LEFT</span>
                <strong id="timer">15</strong>
            </div>

            <div class="test-stat">
                <span>ERRORS</span>
                <strong id="errors">0</strong>
            </div>
        </section>

        <section class="typing-card">

            <div class="typing-label">
                <span>TYPE THE FOLLOWING TEXT</span>
                <span id="testStatus">READY</span>
            </div>

            <div id="passage" class="passage"></div>

            <textarea
                id="typingInput"
                placeholder="Click here and start typing..."
                spellcheck="false"
                autocomplete="off"
                autocapitalize="off"
                disabled
            ></textarea>

            <div class="typing-footer">
                <span id="progress">0 characters typed</span>
                <span>ESC / RESTART</span>
            </div>

        </section>

        <div class="test-actions">
            <button id="startBtn" class="primary-button">
                Start typing →
            </button>
        </div>

        <section id="resultPanel" class="result-panel" hidden>
            <span class="eyebrow">TEST COMPLETED</span>
            <h2>Your performance.</h2>

            <div class="result-grid">
                <div>
                    <strong id="finalWpm">0</strong>
                    <span>WPM</span>
                </div>
                <div>
                    <strong id="finalAccuracy">0%</strong>
                    <span>ACCURACY</span>
                </div>
                <div>
                    <strong id="finalErrors">0</strong>
                    <span>ERRORS</span>
                </div>
            </div>

            <button id="tryAgainBtn" class="primary-button">
                Try again ↻
            </button>
        </section>

    </main>

    <script src="{{ url_for('static', filename='typing.js') }}"></script>

</body>
</html>
